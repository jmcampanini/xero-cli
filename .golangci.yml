version: "2"

run:
  timeout: 5m
  allow-serial-runners: true

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
  settings:
    misspell:
      locale: US
      ignore-rules:
        - organisation
        - organisations
        - authorised

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
