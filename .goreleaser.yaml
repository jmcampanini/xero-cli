version: 2

project_name: xero

builds:
  - id: xero
    main: .
    binary: xero
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      # Keep the v prefix so a release binary reports the same string as `mise run build` on the tagged commit.
      - -s -w -X github.com/jmcampanini/xero-cli/internal/cli.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  # GitHub generates the notes from merged pull requests, shaped by .github/release.yml.
  use: github-native

release:
  github:
    owner: jmcampanini
    name: xero-cli
  draft: false
  prerelease: auto
